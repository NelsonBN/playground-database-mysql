networks:
  demo:
    driver: bridge

services:
  mysql:
    image: mysql:9.7.1
    container_name: mysql
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: a123456789
      MYSQL_DATABASE: northwind
    volumes:
      - ./data/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./data/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 2s
      retries: 20
    networks:
      - demo

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.3
    container_name: phpmyadmin
    restart: always
    ports:
      - 8080:80
    environment:
      PMA_HOST: mysql # Your MySQL container name
      PMA_USER: root # Your MySQL user
      PMA_PASSWORD: a123456789 # Your MySQL password
      PMA_ARBITRARY: 1 # Allows entering database server, username and password manually
    networks:
      - demo
    depends_on:
      mysql:
        condition: service_healthy
